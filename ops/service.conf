# Reviewed bootstrap drop-in; never installed automatically by an artifact.
[Service]
WorkingDirectory=/opt/klop-smile-bot/current
ExecStart=
ExecStart=/usr/bin/node /opt/klop-smile-bot/current/dist/app.js
Environment=BOT_LIFECYCLE_SOCKET=/run/klop-smile-bot/lifecycle.sock
Environment=BOT_RELEASE_FILE=/opt/klop-smile-bot/current/RELEASE_SHA
RuntimeDirectory=klop-smile-bot
RuntimeDirectoryMode=0700
TimeoutStopSec=150
SendSIGKILL=no
